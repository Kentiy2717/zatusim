<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zatusim{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-indigo-400">🎉 Zatusim</a>
        <nav class="space-x-4">
            <a href="/" class="hover:text-indigo-400">Главная</a>
            <a href="/games" class="hover:text-indigo-400">Игры</a>
            <a href="/auth/login" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold transition">Войти</a>
        </nav>
    </header>

    <main class="flex-1 container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-slate-400 text-sm">
        &copy; 2026 Zatusim.online. Все права защищены.
    </footer>
</body>
</html>

name: Production CD (Deploy to VPS)

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [ test ]

    steps:
      - name: Выполнение команд обновления на VPS через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '130.49.153.166'
          username: 'root'
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/zatusim_app
            git pull origin master
            docker compose -f docker-compose.prod.yml up -d --build
